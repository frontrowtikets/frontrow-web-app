services:

  # superbase to be used
  # mysql:
  #   image: mariadb:11.5.2
  #   restart: unless-stopped
  #   tty: true
  #   ports:
  #     - 3307:3306
  #   environment:
  #     MYSQL_DATABASE: "${buddeDB}"
  #     MYSQL_ROOT_PASSWORD: "${buddeDB_Password}"
  #     MYSQL_USER: "${mysql_user}"
  #     MYSQL_PASSWORD: "${mysql_password}"
  #   volumes:
  #     - ./budde-db:/var/lib/mysql
  
  php_frontrow:
    build: 
      context: .
      dockerfile: php.prod.dockerfile
    ports:
      - 9003:9000
    volumes:
      - ./src:/var/www/html
    networks:
      - frontrow_network
    
  
  composer:
    build: 
      context: .
      dockerfile: composer.dockerfile
    volumes:
      - ./src:/var/www/html
    working_dir: /var/www/html
    networks:
      - frontrow_network
 
  
  npm:
    image: node:18.20.3-alpine3.19
    volumes:
      - ./src:/var/www/html
    entrypoint: ["npm"]
    working_dir: /var/www/html
    networks:
      - frontrow_network

  artisan:
    build: 
      context: .
      dockerfile: php.prod.dockerfile
    volumes:
      - ./src:/var/www/html
    networks:
      - frontrow_network

    entrypoint: ["php", "/var/www/html/artisan"]

networks:
  frontrow_network:
    driver: bridge



  




    