name: FRONTROW TIKETS PR CI

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Install Composer Dependencies
        working-directory: src
        run: composer install --no-interaction --prefer-dist

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          # cache is skipped if no lock file

      - name: Install Node.js Dependencies
        working-directory: src
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ] || [ -f yarn.lock ]; then
            echo "Lock file found, using npm ci"
            npm ci --fetch-retries=5 --fetch-retry-maxtimeout=120000
          else
            echo "No lock file found, falling back to npm install"
            npm install --fetch-retries=5 --fetch-retry-maxtimeout=120000
          fi

      - name: Build Vite Assets
        working-directory: src
        run: npm run build
