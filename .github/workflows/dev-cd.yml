name: Deploy to Staging Server

on:
  push:
    branches:
      - development # Trigger deployment on the development branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install Node.js Dependencies
        run: npm install

      - name: Build Vite Assets
        env:
          BUILD_PATH: public/build
        run: |
          echo "Setting build output path to $BUILD_PATH"
          npm run build -- --outDir=$BUILD_PATH

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"

      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}

      - name: Deploy to Server
        env:
          REMOTE_USER: ${{ secrets.REMOTE_DEV_USER }}
          REMOTE_HOST: ${{ secrets.REMOTE_DEV_HOST }}
          REMOTE_PATH: /home/u964704866/public_html/fontrow
        run: |
          # Define the remote SRC and BUILD folder paths
          REMOTE_SRC_PATH=$REMOTE_PATH
          REMOTE_BUILD_PATH=$REMOTE_PATH/public/build

          echo "Connecting to $REMOTE_USER@$REMOTE_HOST on port 65002..."

          # Add the server to known hosts (to avoid manual confirmation)
          ssh-keyscan -p 65002 -H $REMOTE_HOST >> ~/.ssh/known_hosts

          # Create the necessary directory structure on the remote server
          ssh -p 65002 $REMOTE_USER@$REMOTE_HOST "mkdir -p $REMOTE_SRC_PATH $REMOTE_BUILD_PATH"

          # Sync the src folder (excluding build folder) to the remote server
          rsync -avz -e "ssh -p 65002" --exclude="public/build" --delete src/ $REMOTE_USER@$REMOTE_HOST:$REMOTE_SRC_PATH

          echo "Repository synced. Transferring built assets..."

          # Transfer built Vite assets to the remote server
          rsync -avz -e "ssh -p 65002" public/build/ $REMOTE_USER@$REMOTE_HOST:$REMOTE_BUILD_PATH

          echo "Assets transferred. Running Laravel commands on the remote server..."

          # Run Laravel commands on the remote server
          ssh -p 65002 $REMOTE_USER@$REMOTE_HOST bash << 'EOF'
            cd $REMOTE_SRC_PATH
            composer install --no-interaction --prefer-dist
            php artisan migrate --force
            php artisan storage:link
            php artisan cache:clear
            php artisan config:clear
            php artisan config:cache
            php artisan route:cache
            EOF

          echo "Deployment successful!"
