name: FRONTROW TIKETS PR CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18" # Nuxt 3.0.0 safe LTS
          cache: "npm"
          cache-dependency-path: src/package-lock.json # 👈 points to your lock file

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"

      - name: Install Composer Dependencies
        working-directory: src
        run: composer install --no-interaction --prefer-dist

      - name: Install Node.js Dependencies
        working-directory: src
        run: |
          if [ -f package-lock.json ]; then
            echo "Lock file found, using npm ci"
            npm ci --fetch-retries=5 --fetch-retry-maxtimeout=120000
          else
            echo "No lock file found, falling back to npm install"
            npm install --fetch-retries=5 --fetch-retry-maxtimeout=120000
          fi

      - name: Build Vite Assets
        working-directory: src
        run: npm run build

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}

      - name: Sync to Production Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_DEV_HOST }}
          username: ${{ secrets.REMOTE_DEV_USER }}
          key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          port: 65002
          script: |
            cd /home/u964704866/domains/frontrowtikets.com/public_html/src
            eval "$(ssh-agent -s)"
            ssh-add ~/.ssh/id_rsa_git
            git stash save --include-untracked
            git stash drop
            git pull origin main

            if [ -f artisan ]; then
              ~/bin/composer install --no-interaction --prefer-dist
              chmod -R 755 vendor
              ~/bin/composer dump-autoload -o
              chmod -R 777 storage bootstrap
              php artisan storage:link || true
              php artisan optimize:clear
              php artisan migrate --force
            else
              echo "artisan file not found! Ensure the project was correctly deployed."
            fi

      - name: Transfer Built Assets
        env:
          REMOTE_USER: ${{ secrets.REMOTE_DEV_USER }}
          REMOTE_HOST: ${{ secrets.REMOTE_DEV_HOST }}
          REMOTE_PATH: /home/u964704866/domains/frontrowtikets.com/public_html/src
        run: |
          REMOTE_SRC_PATH=$REMOTE_PATH
          REMOTE_BUILD_PATH=$REMOTE_PATH/public/build

          echo "Connecting to $REMOTE_USER@$REMOTE_HOST on port 65002..."

          # Add server to known hosts
          ssh-keyscan -p 65002 -H $REMOTE_HOST >> ~/.ssh/known_hosts

          # Ensure remote build directory exists
          ssh -p 65002 $REMOTE_USER@$REMOTE_HOST "mkdir -p $REMOTE_SRC_PATH $REMOTE_BUILD_PATH"

          echo "Transferring built assets..."
          rsync -avz -e "ssh -p 65002" src/public/build/ $REMOTE_USER@$REMOTE_HOST:$REMOTE_BUILD_PATH
